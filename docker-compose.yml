services:
  # 1. Evaluation & XAI Service (Port 8000)
  evaluation-xai:
    build:
      context: ../evaluation-xai
      dockerfile: Dockerfile
    container_name: robo-eval-xai
    ports:
      - "8000:8000"
    volumes:
      # XAI 서버가 로컬의 artifacts 폴더(evaluation.json)를 읽을 수 있도록 연결!
      - ../evaluation-xai/artifacts:/app/artifacts:ro
    environment:
      # 읽을 산출물 폴더를 명시 (기본값과 동일하지만 설정을 코드 밖으로 분리)
      - EVALUATION_ARTIFACT_DIR=${EVALUATION_ARTIFACT_DIR:-/app/artifacts/demo}
    networks:
      - robo-net
    restart: unless-stopped

  # 2. Agentic Research Service (Port 8001)
  agentic-research:
    build:
      context: ../agentic-research
      dockerfile: Dockerfile
    container_name: robo-agentic-research
    ports:
      - "8001:8001"
    env_file:
      # .env가 없으면 키 없이 동작하는 rule/hash 기본값으로 기동
      - path: ../agentic-research/.env
        required: false
    volumes:
      # 서비스 설정(AGENT_*)이 가리키는 /app/data 경로에 data-pipeline 산출물을 읽기 전용으로 연결
      - ../data-pipeline/data/raw/news:/app/data/raw/news:ro
      - ../data-pipeline/data/processed:/app/data/processed:ro
      - ../agentic-research/artifacts:/app/artifacts
    environment:
      # .env의 상대경로 값보다 우선 적용되도록 컨테이너 절대경로로 고정
      - AGENT_NEWS_DIR=/app/data/raw/news
      - AGENT_RETURNS_PATH=/app/data/processed/returns.parquet
      - AGENT_CHROMA_DIR=/app/artifacts/chroma
      - AGENT_RISK_TAGS_PATH=/app/artifacts/risk_tags.jsonl
    networks:
      - robo-net
    restart: unless-stopped

  # 3. RL Optimization Serving Service (Port 8002)
  rl-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robo-rl-server
    command: uvicorn rl_server:app --host 0.0.0.0 --port 8002
    ports:
      - "8002:8002"
    volumes:
      - ../rl-engine:/rl-engine:ro
    environment:
      - RL_REPO_PATH=/rl-engine
    networks:
      - robo-net
    restart: unless-stopped

  # 4. Unified API Gateway (Port 8080 - 5대 필수 엔드포인트 단일 진입점)
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robo-api-gateway
    command: uvicorn gateway:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      - EVAL_API_URL=http://evaluation-xai:8000
      - AGENT_API_URL=http://agentic-research:8001
      - RL_API_URL=http://rl-engine:8002
    depends_on:
      - evaluation-xai
      - agentic-research
      - rl-engine
    networks:
      - robo-net
    restart: unless-stopped

  # 5. Streamlit Interactive Web Dashboard (Port 8501)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: robo-dashboard
    command: streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      - GATEWAY_URL=http://api-gateway:8080
    depends_on:
      - api-gateway
    networks:
      - robo-net
    restart: unless-stopped

networks:
  robo-net:
    driver: bridge