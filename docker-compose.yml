# 통합 로보어드바이저 일괄 실행 (제출·채점용)
#   docker compose up --build
# - 팀원 서비스는 GitHub 레포를 커밋 고정으로 빌드한다 (platform 레포만 clone하면 됨)
# - 데이터·벡터DB·평가 산출물은 git에 없으므로(뉴스 재배포 금지) bootstrap 컨테이너가
#   팀원 코드로 직접 생성해 named volume에 저장한다. 두 번째 실행부터는 건너뛴다
# - 로컬 형제 폴더(../)의 작업 중 코드로 빌드하려면 docker-compose.local.yml을 함께 사용
#
# 팀원 레포 커밋 고정값 (갱신 시 아래 build.context의 #<sha>를 함께 변경)
#   agentic-research  c395f1a / evaluation-xai a4b96f4 / data-pipeline 0bbd15f
#   rl-engine 05579d2 와 모델 번들(Release models-v1)은 Dockerfile.rl에서 고정
#   (eval-bootstrap의 EVAL_COMMIT·RL_ENGINE_COMMIT도 같은 값으로 맞춘다)

x-health: &health
  interval: 5s
  timeout: 3s
  retries: 12
  start_period: 10s

services:
  # ---------------------------------------------------------------
  # Bootstrap 1. data-pipeline: 가격 수집 → 전처리 → 뉴스/공시 수집 → 이상치 리포트
  #   키가 없어도 가격·SEC·한국경제 RSS는 수집되고 DART만 건너뛴다
  # ---------------------------------------------------------------
  data-bootstrap:
    build:
      context: https://github.com/codyssey-dmu-2026/data-pipeline.git#0bbd15f0f4bf93e616105d5782798f7e25c90c19
      # data-pipeline 레포에는 Dockerfile이 없어 platform에서 정의 (README 권장 Python 3.12)
      # .dockerignore가 없는 레포라 .env·.venv·data가 섞이지 않도록 소스(*.py)만 복사
      # (빌드 정의를 PowerShell 파이프로 넘기므로 인라인 내용은 ASCII로 유지)
      dockerfile_inline: |
        FROM python:3.12-slim
        ENV PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1
        WORKDIR /app
        COPY requirements.txt .
        RUN pip install --no-cache-dir -r requirements.txt
        COPY *.py ./
    image: robo-data-pipeline:local
    container_name: robo-data-bootstrap
    environment:
      DART_API_KEY: ${DART_API_KEY:-}
      SEC_EDGAR_CONTACT_EMAIL: ${SEC_EDGAR_CONTACT_EMAIL:-}
      BOOTSTRAP_FORCE: ${BOOTSTRAP_FORCE:-0}
    command:
      - sh
      - -c
      - |
        if [ -f /app/data/processed/returns.parquet ] && [ "$$BOOTSTRAP_FORCE" != "1" ]; then
          echo "[data-bootstrap] 기존 데이터 사용 (재수집: BOOTSTRAP_FORCE=1)"
        else
          python main.py
        fi
    volumes:
      - pipeline-data:/app/data
    networks:
      - robo-net
    restart: "no"

  # ---------------------------------------------------------------
  # Bootstrap 2. agentic-research: 뉴스 → ChromaDB 적재, RiskTag 생성
  #   뉴스가 하나도 없으면 적재가 실패하지만 서비스 기동은 막지 않는다 (/research가 503 반환)
  # ---------------------------------------------------------------
  agent-bootstrap:
    build: &agent-build
      context: https://github.com/codyssey-dmu-2026/agentic-research.git#c395f1a341fe46677edeed49cc114b958efe6fc6
      dockerfile: Dockerfile
    image: robo-agentic-research:local
    container_name: robo-agent-bootstrap
    environment: &agent-env
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # 적재와 서빙이 같은 임베딩을 써야 하므로 두 컨테이너가 같은 값을 공유
      AGENT_LLM_PROVIDER: ${AGENT_LLM_PROVIDER:-rule}
      AGENT_EMBEDDING_PROVIDER: ${AGENT_EMBEDDING_PROVIDER:-hash}
      AGENT_NEWS_DIR: /app/data/raw/news
      AGENT_RETURNS_PATH: /app/data/processed/returns.parquet
      AGENT_CHROMA_DIR: /app/artifacts/chroma
      AGENT_RISK_TAGS_PATH: /app/artifacts/risk_tags.jsonl
      BOOTSTRAP_FORCE: ${BOOTSTRAP_FORCE:-0}
    command:
      - sh
      - -c
      - |
        if [ -f /app/artifacts/risk_tags.jsonl ] && [ "$$BOOTSTRAP_FORCE" != "1" ]; then
          echo "[agent-bootstrap] 기존 벡터DB·RiskTag 사용 (재생성: BOOTSTRAP_FORCE=1)"
          exit 0
        fi
        python -m agentic_research.ingest || echo "[agent-bootstrap] 경고: 뉴스 적재 실패 (뉴스 CSV 없음?)"
        python -m agentic_research.risk || echo "[agent-bootstrap] 경고: RiskTag 생성 실패"
    volumes:
      - pipeline-data:/app/data:ro
      - agent-artifacts:/app/artifacts
    depends_on:
      data-bootstrap:
        condition: service_completed_successfully
    networks:
      - robo-net
    restart: "no"

  # ---------------------------------------------------------------
  # Bootstrap 3. evaluation-xai: 오프라인 평가 산출물 생성
  #   현재는 synthetic 데모(실제 PPO 결과 아님). rl-engine 결과 연동 후 교체 예정
  # ---------------------------------------------------------------
  eval-bootstrap:
    build: &eval-build
      context: https://github.com/codyssey-dmu-2026/evaluation-xai.git#a4b96f4e80726dd084caa2e5d1e9afa524af8eb5
      dockerfile: Dockerfile
    image: robo-evaluation-xai:local
    container_name: robo-eval-bootstrap
    environment:
      BOOTSTRAP_FORCE: ${BOOTSTRAP_FORCE:-0}
      MPLCONFIGDIR: /tmp/matplotlib
      # 평가 코드 커밋이 바뀌면 산출물을 다시 만든다 (위 build.context의 커밋과 같은 값)
      EVAL_COMMIT: a4b96f4e80726dd084caa2e5d1e9afa524af8eb5
      # evaluation-xai compare-rl 결과 (재왕 님 실행: ANOVA 3종·MVO·실제 PPO SHAP 포함).
      # git에 없는 산출물이라 platform Release에 두고 지문(sha256)을 검사한다
      EVAL_RESULTS_URL: https://github.com/codyssey-dmu-2026/robo-advisor-platform/releases/download/eval-results-v1/evaluation-xai-rl-comparison-20261123-mac-all60.tar.gz
      EVAL_RESULTS_SHA256: cf37d7b01ff97316a46cf036e2adde83454ec55bf211d33c3b94f705970a727b
      # 위 결과를 받지 못할 때 대체 분석에 쓸 rl-engine 공개 결과 커밋 (Dockerfile.rl과 같은 값)
      RL_ENGINE_COMMIT: 05579d2c845e959fd7948f8cd5a826ca0a3b0599
    # 산출물 2종 (평가 서비스 두 개가 항상 이 두 폴더를 읽는다)
    #   results: 성과 지표·ANOVA (/backtest). 기본은 compare-rl 결과, 받지 못하면 import-rl 분석으로 대체
    #   explain: SHAP 설명·그림 (/explain). 기본은 compare-rl 결과에 연결된 실제 SHAP, 대체 시 합성 데모
    command:
      - sh
      - -c
      - |
        set -e
        A=/app/artifacts
        STAMP="$$EVAL_COMMIT $$EVAL_RESULTS_SHA256"
        if [ "$$BOOTSTRAP_FORCE" != "1" ] && [ -f $$A/results/evaluation.json ] \
           && [ -f $$A/explain/evaluation.json ] && [ "$$(cat $$A/.eval-commit 2>/dev/null)" = "$$STAMP" ]; then
          echo "[eval-bootstrap] 기존 평가 산출물 사용 (재생성: BOOTSTRAP_FORCE=1)"
          exit 0
        fi
        rm -rf $$A/results $$A/explain $$A/team-results $$A/demo /tmp/rl /tmp/eval-bundle
        echo "[eval-bootstrap] evaluation-xai compare-rl 결과 내려받는 중"
        if python - <<'PY'
        import hashlib, os, pathlib, shutil, sys, tarfile, urllib.request
        url, digest = os.environ["EVAL_RESULTS_URL"], os.environ["EVAL_RESULTS_SHA256"]
        # 선택: 같은 파일을 /eval-inbox에 마운트하면 내려받지 않는다 (오프라인 개발용)
        local = pathlib.Path("/eval-inbox") / url.rsplit("/", 1)[-1]
        try:
            data = local.read_bytes() if local.is_file() else urllib.request.urlopen(url, timeout=120).read()
        except OSError as error:
            sys.exit(f"[eval-bootstrap] 내려받기 실패: {error}")
        if hashlib.sha256(data).hexdigest() != digest:
            sys.exit("[eval-bootstrap] 지문(sha256)이 달라 사용하지 않음")
        archive = pathlib.Path("/tmp/eval-bundle.tar.gz")
        archive.write_bytes(data)
        with tarfile.open(archive) as tar:
            tar.extractall("/tmp/eval-bundle", filter="data")
        found = [p.parent for p in pathlib.Path("/tmp/eval-bundle").glob("*/evaluation.json")]
        if len(found) != 1:
            sys.exit("[eval-bootstrap] 결과 묶음 형식이 다름")
        shutil.move(str(found[0]), "/app/artifacts/results")
        PY
        then
          ln -s results $$A/explain
          echo "[eval-bootstrap] compare-rl 결과 사용 (ANOVA 3종·실제 SHAP)"
        else
          echo "[eval-bootstrap] 대체 분석: rl-engine 공개 CSV(import-rl) + SHAP 합성 데모"
          if [ -f /rl-engine-models/eval_test_daily.csv ]; then
            RL_MODELS=/rl-engine-models
          else
            python - <<'PY'
        import io, os, tarfile, urllib.request
        url = "https://codeload.github.com/codyssey-dmu-2026/rl-engine/tar.gz/" + os.environ["RL_ENGINE_COMMIT"]
        with urllib.request.urlopen(url, timeout=120) as r:
            archive = tarfile.open(fileobj=io.BytesIO(r.read()), mode="r:gz")
        os.makedirs("/tmp/rl/models", exist_ok=True)
        for m in archive.getmembers():
            parts = m.name.split("/")
            if m.isfile() and len(parts) == 3 and parts[1] == "models" and parts[2].endswith((".csv", ".json")):
                with open("/tmp/rl/models/" + parts[2], "wb") as f:
                    f.write(archive.extractfile(m).read())
        PY
            RL_MODELS=/tmp/rl/models
          fi
          python -m evaluation_xai import-rl --models-dir "$$RL_MODELS" --output $$A/results
          python -m evaluation_xai demo --output $$A/explain --with-shap
        fi
        echo "$$STAMP" > $$A/.eval-commit
    volumes:
      - eval-artifacts:/app/artifacts
    networks:
      - robo-net
    restart: "no"

  # 1. Evaluation & XAI Service (Port 8000): 성과 지표·ANOVA (/backtest)
  evaluation-xai:
    build: *eval-build
    image: robo-evaluation-xai:local
    container_name: robo-eval-xai
    ports:
      - "8000:8000"
    volumes:
      - eval-artifacts:/app/artifacts:ro
    environment:
      EVALUATION_ARTIFACT_DIR: ${EVALUATION_ARTIFACT_DIR:-/app/artifacts/results}
    depends_on:
      eval-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *health
    networks:
      - robo-net
    restart: unless-stopped

  # 1-1. 같은 이미지의 SHAP 설명 전용 인스턴스 (내부망 전용, /explain·Summary/Force Plot)
  #   evaluation-xai API는 산출물 폴더 하나만 읽으므로, 성과(results)와 설명(explain)을 나눠 띄운다
  #   (compare-rl 결과를 쓰면 explain은 results와 같은 폴더를 가리킨다)
  evaluation-xai-explain:
    image: robo-evaluation-xai:local
    container_name: robo-eval-xai-explain
    volumes:
      - eval-artifacts:/app/artifacts:ro
    environment:
      EVALUATION_ARTIFACT_DIR: ${EVAL_EXPLAIN_ARTIFACT_DIR:-/app/artifacts/explain}
    depends_on:
      eval-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      <<: *health
    networks:
      - robo-net
    restart: unless-stopped

  # 2. Agentic Research Service (Port 8001)
  agentic-research:
    build: *agent-build
    image: robo-agentic-research:local
    container_name: robo-agentic-research
    ports:
      - "8001:8001"
    environment: *agent-env
    volumes:
      - pipeline-data:/app/data:ro
      - agent-artifacts:/app/artifacts
    depends_on:
      agent-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      <<: *health
    networks:
      - robo-net
    restart: unless-stopped

  # 3. RL Optimization Serving Service (Port 8002)
  #   학습된 PPO 모델의 목표 비중을 서빙하고, agent-bootstrap이 만든 RiskTag를
  #   읽기 전용으로 받아 위험 신호가 강한 자산 비중을 줄인다 (리스크 태그 Safe-Guard)
  rl-engine:
    build:
      context: .
      dockerfile: Dockerfile.rl
    image: robo-rl:local
    container_name: robo-rl-server
    ports:
      - "8002:8002"
    environment:
      RL_MODEL_NAME: ${RL_MODEL_NAME:-ppo_test_w4_simple_s42}
      RL_DATA_DIR: /pipeline-data/processed
      # 리스크 태그 Safe-Guard: 태그 파일이 없으면 모델 비중 그대로 응답
      RISK_TAGS_PATH: /agent-artifacts/risk_tags.jsonl
      RISK_TAG_THRESHOLD: ${RISK_TAG_THRESHOLD:-0.5}
      RISK_TAG_MAX_CUT: ${RISK_TAG_MAX_CUT:-0.5}
    volumes:
      - pipeline-data:/pipeline-data:ro
      - agent-artifacts:/agent-artifacts:ro
    depends_on:
      data-bootstrap:
        condition: service_completed_successfully
      agent-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      <<: *health
      start_period: 60s
    networks:
      - robo-net
    restart: unless-stopped

  # 4. Unified API Gateway (Port 8080 - 5대 필수 엔드포인트 단일 진입점)
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: robo-platform:local
    container_name: robo-api-gateway
    command: uvicorn gateway:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    environment:
      EVAL_API_URL: http://evaluation-xai:8000
      EVAL_EXPLAIN_API_URL: http://evaluation-xai-explain:8000
      AGENT_API_URL: http://agentic-research:8001
      RL_API_URL: http://rl-engine:8002
      # 일별 시계열(/backtest/{run_id}/timeseries)을 evaluation-xai 산출물에서 읽음
      EVAL_ARTIFACT_DIR: /eval-artifacts/results
    volumes:
      - eval-artifacts:/eval-artifacts:ro
    depends_on:
      evaluation-xai:
        condition: service_healthy
      evaluation-xai-explain:
        condition: service_healthy
      agentic-research:
        condition: service_healthy
      rl-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      <<: *health
    networks:
      - robo-net
    restart: unless-stopped

  # 5. Streamlit Interactive Web Dashboard (Port 8501)
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    image: robo-platform:local
    container_name: robo-dashboard
    command: streamlit run dashboard/app.py --server.port=8501 --server.address=0.0.0.0
    ports:
      - "8501:8501"
    environment:
      GATEWAY_URL: http://api-gateway:8080
    depends_on:
      api-gateway:
        condition: service_healthy
    networks:
      - robo-net
    restart: unless-stopped

volumes:
  pipeline-data:
  agent-artifacts:
  eval-artifacts:

networks:
  robo-net:
    driver: bridge
