# 대시보드 테마. 라이트/다크 두 벌을 정의하면 우측 상단 ⋮ 메뉴의 System·Light·Dark로 전환
# 색상은 검증된 데이터 시각화 팔레트(색각 이상 대비 검증 통과)를 사용

[server]
headless = true

[browser]
gatherUsageStats = false

[client]
# viewer: 개발자 메뉴는 숨기고 테마 전환(System·Light·Dark)은 보이게 함. minimal은 메뉴 자체를 숨김
toolbarMode = "viewer"

[theme]
font = "Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', system-ui, -apple-system, 'Segoe UI', sans-serif"
headingFontWeights = [700, 650, 600]
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.light]
primaryColor = "#2a78d6"
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
borderColor = "#e1e0d9"
linkColor = "#256abf"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#6250d6", "#e34948"]

[theme.light.sidebar]
backgroundColor = "#fcfcfb"

[theme.dark]
primaryColor = "#3987e5"
backgroundColor = "#0d0d0d"
secondaryBackgroundColor = "#1a1a19"
textColor = "#f0efec"
borderColor = "#2c2c2a"
linkColor = "#6da7ec"
chartCategoricalColors = ["#3987e5", "#d95926", "#199e70", "#c98500", "#d55181", "#008300", "#9085e9", "#e66767"]

[theme.dark.sidebar]
backgroundColor = "#141413"
