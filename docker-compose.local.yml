# 개발용 덮어쓰기: GitHub 고정 커밋 대신 형제 폴더(../)의 작업 중 코드로 빌드
#   docker compose -f docker-compose.yml -f docker-compose.local.yml up --build
# 전제: robo-advisor-platform, data-pipeline, agentic-research, evaluation-xai, rl-engine이
#       같은 상위 폴더에 나란히 있어야 한다. 산출물은 기본 모드와 같은 bootstrap·volume을 사용

services:
  data-bootstrap:
    build:
      context: ../data-pipeline

  agent-bootstrap:
    build:
      context: ../agentic-research

  agentic-research:
    build:
      context: ../agentic-research

  eval-bootstrap:
    build:
      context: ../evaluation-xai

  evaluation-xai:
    build:
      context: ../evaluation-xai

  # rl-engine 로컬 사본의 models/ 폴더를 읽기 전용으로 연결 (모델 연동 작업용)
  rl-engine:
    volumes:
      - ../rl-engine:/rl-engine:ro
